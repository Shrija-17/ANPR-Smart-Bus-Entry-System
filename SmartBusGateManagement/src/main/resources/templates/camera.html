<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Live Camera</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<header>
    <h1>Live Camera Detection</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Camera Feed</h2>

        <p>Live YOLOv8 ANPR camera works here.</p>

        <hr>

        <h3>Detected Plate Number</h3>

        <h2 style="color:green;" th:text="${plateNumber}">
            Waiting...
        </h2>

        <hr>

        <h3>Status</h3>

        <h2 th:text="${status}"></h2>

        <div th:if="${bus != null}">

            <h3>Registered Bus Details</h3>

            <p><strong>Bus Number:</strong> <span th:text="${bus.busNumber}"></span></p>

            <p><strong>Route:</strong> <span th:text="${bus.route}"></span></p>

            <p><strong>Destination:</strong> <span th:text="${bus.destination}"></span></p>

        </div>

    </div>

</div>

</body>

</html>
